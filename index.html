<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Relationship Manager · Studio 03</title>
<style>
  :root{
    --bg-app:#f8fafc; --bg-card:#ffffff; --border:#e2e8f0; --border-hover:#cbd5e1;
    --text:#0f172a; --muted:#64748b; --faint:#94a3b8; --hover:#f1f5f9;
    --active-bg:#eef2ff; --active-text:#4f46e5; --input-bg:#ffffff; --overlay:rgba(15,15,20,.45);
    --accent:#4f46e5; --accent-2:#7c3aed; --accent-hover:#4338ca;
    --emerald:#10b981; --amber:#f59e0b; --rose:#f43f5e;
    --badge-indigo-bg:#eef2ff; --badge-indigo-text:#4f46e5; --badge-indigo-border:#e0e7ff;
    --badge-emerald-bg:#ecfdf5; --badge-emerald-text:#059669; --badge-emerald-border:#d1fae5;
    --badge-amber-bg:#fffbeb; --badge-amber-text:#b45309; --badge-amber-border:#fef3c7;
    --badge-rose-bg:#fff1f2; --badge-rose-text:#e11d48; --badge-rose-border:#ffe4e6;
    --badge-slate-bg:#f1f5f9; --badge-slate-text:#475569; --badge-slate-border:#e2e8f0;
  }
  body.dark{
    --bg-app:#000000; --bg-card:#0f172a; --border:#1e293b; --border-hover:#334155;
    --text:#f8fafc; --muted:#94a3b8; --faint:#64748b; --hover:#1e293b;
    --active-bg:#1e1b4b; --active-text:#a5b4fc; --input-bg:#0f172a; --overlay:rgba(0,0,0,.65);
    --badge-indigo-bg:#1e1b4b; --badge-indigo-text:#a5b4fc; --badge-indigo-border:#312e81;
    --badge-emerald-bg:#022c22; --badge-emerald-text:#6ee7b7; --badge-emerald-border:#064e3b;
    --badge-amber-bg:#451a03; --badge-amber-text:#fcd34d; --badge-amber-border:#78350f;
    --badge-rose-bg:#4c0519; --badge-rose-text:#fda4af; --badge-rose-border:#881337;
    --badge-slate-bg:#1e293b; --badge-slate-text:#cbd5e1; --badge-slate-border:#334155;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg-app); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"PingFang TC","Microsoft JhengHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background .2s ease,color .2s ease;
  }
  button,input,select,textarea{font-family:inherit; color:inherit;}
  button{cursor:pointer; border:none; background:none;}
  .icon{display:inline-block; vertical-align:middle; flex-shrink:0;}
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* layout */
  #app{display:flex; min-height:100vh;}
  .sidebar{
    width:64px; flex-shrink:0; border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:20px 8px; background:var(--bg-app);
  }
  @media(min-width:768px){ .sidebar{ width:224px; padding:20px 16px; } }
  .sidebar-brand{display:flex; align-items:center; gap:10px; padding:0 6px; margin-bottom:32px;}
  .brand-icon{
    width:32px; height:32px; border-radius:10px; flex-shrink:0;
    background:linear-gradient(135deg,#315c45,#67816b);
    display:flex; align-items:center; justify-content:center;
  }
  .brand-icon svg{color:#fff;}
  .brand-label{display:none; font-weight:600; font-size:14px;}
  @media(min-width:768px){ .brand-label{display:inline;} }
  .nav{display:flex; flex-direction:column; gap:4px;}
  .nav-item{
    display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:12px;
    font-size:14px; font-weight:500; color:var(--muted); width:100%; text-align:left;
    transition:background .15s,color .15s;
  }
  .nav-item:hover{ background:var(--hover); }
  .nav-item.active{ background:var(--active-bg); color:var(--active-text); }
  .nav-label{display:none;}
  @media(min-width:768px){ .nav-label{display:inline;} }
  .sidebar-foot{margin-top:auto; display:none; padding:12px 6px; font-size:12px; color:var(--faint); line-height:1.6;}
  @media(min-width:768px){ .sidebar-foot{display:block;} }

  .main-col{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{
    height:64px; border-bottom:1px solid var(--border); display:flex; align-items:center;
    justify-content:space-between; padding:0 24px; flex-shrink:0; position:relative;
  }
  .topbar-greeting{font-size:14px; font-weight:500;}
  .topbar-date{font-size:12px; color:var(--faint); margin-top:2px;}
  .topbar-actions{display:flex; align-items:center; gap:8px;}
  .icon-btn{
    width:36px; height:36px; border-radius:999px; display:flex; align-items:center; justify-content:center;
    color:var(--muted); position:relative; transition:background .15s;
  }
  .icon-btn:hover{ background:var(--hover); }
  .badge-dot{
    position:absolute; top:-1px; right:-1px; width:16px; height:16px; border-radius:999px;
    background:#f43f5e; color:#fff; font-size:10px; font-weight:600; display:flex; align-items:center; justify-content:center;
  }
  .avatar-me{
    width:36px; height:36px; border-radius:999px; background:linear-gradient(135deg,#315c45,#67816b);
    color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; margin-left:4px;
  }
  .bell-dropdown{
    position:absolute; right:24px; top:56px; width:320px; border-radius:16px; border:1px solid var(--border);
    background:var(--bg-card); box-shadow:0 20px 40px rgba(0,0,0,.15); z-index:30; padding:12px;
  }
  .bell-dropdown-title{font-size:12px; font-weight:600; color:var(--muted); padding:0 8px 8px;}
  .bell-item{padding:8px; border-radius:10px; font-size:12px;}
  .bell-item:hover{ background:var(--hover); }
  .bell-item b{font-weight:500; color:var(--text);}
  .bell-more{width:100%; text-align:center; font-size:12px; font-weight:500; color:var(--accent); padding:8px 0; margin-top:4px;}
  .bell-more:hover{ color:var(--accent-hover); }

  main{flex:1; overflow-y:auto; padding:24px;}

  /* generic */
  .flex{display:flex;}
  .flex-col{display:flex; flex-direction:column;}
  .items-center{align-items:center;}
  .items-start{align-items:flex-start;}
  .justify-between{justify-content:space-between;}
  .gap-1{gap:4px;} .gap-2{gap:8px;} .gap-3{gap:12px;} .gap-4{gap:16px;}
  .flex-wrap{flex-wrap:wrap;}
  .min-w-0{min-width:0;}
  .flex-1{flex:1;}
  .truncate{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .text-xs{font-size:12px;} .text-sm{font-size:14px;} .text-base{font-size:16px;} .text-lg{font-size:18px;} .text-xl{font-size:20px;}
  .font-medium{font-weight:500;} .font-semibold{font-weight:600;}
  .muted{color:var(--muted);} .faint{color:var(--faint);}
  .mb-1{margin-bottom:4px;} .mb-2{margin-bottom:8px;} .mb-3{margin-bottom:12px;} .mb-4{margin-bottom:16px;}
  .mt-1{margin-top:4px;} .mt-2{margin-top:8px;} .mt-3{margin-top:12px;} .mt-4{margin-top:16px;}

  .card{
    border-radius:18px; border:1px solid var(--border); background:var(--bg-card); padding:20px;
    transition:border-color .15s;
  }
  .card:hover{ border-color:var(--border-hover); }
  .card-flat{padding:0; overflow:hidden;}
  .section-title{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .section-title-left{display:flex; align-items:center; gap:8px;}
  .section-title h3{margin:0; font-size:14px; font-weight:600;}

  .row-btn{
    display:flex; align-items:center; gap:12px; padding:8px; border-radius:12px; width:100%; text-align:left;
    transition:background .15s;
  }
  .row-btn:hover{ background:var(--hover); }
  .empty-row{padding:24px 0; text-align:center; font-size:14px; color:var(--faint);}

  .avatar{
    border-radius:999px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:600; flex-shrink:0;
  }
  .avatar-sm{width:32px; height:32px; font-size:12px;}
  .avatar-md{width:40px; height:40px; font-size:14px;}
  .avatar-lg{width:56px; height:56px; font-size:20px;}

  .badge{
    display:inline-flex; align-items:center; gap:4px; padding:2px 10px; border-radius:999px; font-size:11px;
    font-weight:500; border:1px solid; white-space:nowrap;
  }
  .badge-indigo{ background:var(--badge-indigo-bg); color:var(--badge-indigo-text); border-color:var(--badge-indigo-border); }
  .badge-emerald{ background:var(--badge-emerald-bg); color:var(--badge-emerald-text); border-color:var(--badge-emerald-border); }
  .badge-amber{ background:var(--badge-amber-bg); color:var(--badge-amber-text); border-color:var(--badge-amber-border); }
  .badge-rose{ background:var(--badge-rose-bg); color:var(--badge-rose-text); border-color:var(--badge-rose-border); }
  .badge-slate{ background:var(--badge-slate-bg); color:var(--badge-slate-text); border-color:var(--badge-slate-border); }

  .btn{
    display:inline-flex; align-items:center; gap:6px; font-size:14px; font-weight:500; padding:10px 16px;
    border-radius:12px; transition:background .15s,opacity .15s;
  }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:hover{ background:var(--accent-hover); }
  .btn-primary:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-outline{ border:1px solid var(--border); color:var(--text); }
  .btn-outline:hover{ background:var(--hover); }
  .btn-ghost{ color:var(--muted); }
  .btn-ghost:hover{ background:var(--hover); }

  input[type=text], input[type=date], input[type=search], input[type=time],
  input[type=number], input[type=email], input[type=tel], input[type=password], select, textarea{
    font-size:14px; border-radius:12px; border:1px solid var(--border); background:var(--input-bg); color:var(--text);
    padding:8px 12px; outline:none; width:100%;
  }
  input:focus, select:focus, textarea:focus{ border-color:var(--accent); }
  textarea{ resize:none; }

  /* dashboard */
  .stats-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
  @media(min-width:640px){ .stats-grid{grid-template-columns:repeat(3,1fr);} }
  @media(min-width:1024px){ .stats-grid{grid-template-columns:repeat(6,1fr);} }
  .dash-grid{display:grid; grid-template-columns:1fr; gap:16px;}
  @media(min-width:1024px){ .dash-grid{grid-template-columns:2fr 1fr;} }
  .hero-card{
    border-radius:18px; padding:24px; color:#fff;
    background:linear-gradient(135deg,#4f46e5,#4f46e5 40%,#7c3aed);
  }
  .hero-card .hero-tag{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; letter-spacing:.02em; margin-bottom:10px;}
  .hero-card p{font-size:18px; line-height:1.6; font-weight:500; max-width:640px; margin:0;}
  .hero-btn{
    margin-top:16px; font-size:13px; background:rgba(255,255,255,.16); padding:8px 16px; border-radius:999px; font-weight:500; color:#fff;
  }
  .hero-btn:hover{ background:rgba(255,255,255,.26); }
  .cards-grid{display:grid; grid-template-columns:1fr; gap:16px; margin-top:16px;}
  @media(min-width:768px){ .cards-grid{grid-template-columns:1fr 1fr;} }
  @media(min-width:1280px){ .cards-grid{grid-template-columns:1fr 1fr 1fr;} }
  .todo-list{display:flex; flex-direction:column; gap:2px; overflow-y:auto; max-height:224px;}
  .todo-item{display:flex; align-items:center; gap:8px; padding:8px; border-radius:10px; text-align:left; width:100%;}
  .todo-item:hover{ background:var(--hover); }
  .todo-name{flex:1; font-size:14px;}
  .todo-done{ text-decoration:line-through; color:var(--faint); }
  .todo-time{font-size:12px; color:var(--faint);}

  /* customers */
  .toolbar{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .search-box{
    display:flex; align-items:center; gap:8px; border:1px solid var(--border); border-radius:12px;
    padding:8px 12px; flex:1; min-width:220px; background:var(--input-bg);
  }
  .search-box input{border:none; padding:0; background:transparent;}
  .search-box input:focus{border:none;}
  table{width:100%; border-collapse:collapse; font-size:14px;}
  thead tr{border-bottom:1px solid var(--border);}
  th{text-align:left; font-weight:500; color:var(--muted); padding:12px 16px; font-size:13px;}
  td{padding:12px 16px; border-bottom:1px solid var(--border);}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{ background:var(--hover); }
  .col-hide-sm{display:none;} @media(min-width:640px){ .col-hide-sm{display:table-cell;} }
  .only-md{display:none;} @media(min-width:640px){ .only-md{display:flex;} }
  td .cust-name{white-space:nowrap;} td .cust-meta{white-space:nowrap;}
  .col-hide-md{display:none;} @media(min-width:768px){ .col-hide-md{display:table-cell;} }
  .col-hide-lg{display:none;} @media(min-width:1024px){ .col-hide-lg{display:table-cell;} }
  .link-btn{color:var(--accent); font-size:14px; font-weight:500; display:inline-flex; align-items:center; gap:2px; white-space:nowrap; flex-shrink:0;}
  .link-btn:hover{ color:var(--accent-hover); }

  /* customer detail */
  .stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
  .stat-card{text-align:center; padding:16px;}
  .stat-label{font-size:12px; color:var(--faint);}
  .stat-value{font-size:18px; font-weight:600; margin-top:4px;}
  .tags-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); overflow-x:auto;}
  .tab-btn{
    padding:10px 16px; font-size:14px; font-weight:500; border-bottom:2px solid transparent; margin-bottom:-1px;
    color:var(--muted); white-space:nowrap;
  }
  .tab-btn.active{ border-color:var(--accent); color:var(--accent); }
  .tab-btn:hover:not(.active){ color:var(--text); }
  .info-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; font-size:14px;}
  @media(max-width:480px){ .info-grid{grid-template-columns:1fr;} }
  .info-grid .span-2{grid-column:1 / -1;}
  .info-label{font-size:12px; color:var(--faint); margin-bottom:4px;}
  .product-row{display:flex; align-items:center; justify-content:space-between; padding:12px; border:1px solid var(--border); border-radius:14px; margin-bottom:10px;}
  .timeline-item{display:flex; gap:12px;}
  .timeline-dot-col{display:flex; flex-direction:column; align-items:center;}
  .timeline-dot{width:10px; height:10px; border-radius:999px; background:var(--accent); margin-top:6px;}
  .timeline-line{width:1px; flex:1; background:var(--border);}
  .insight-row{display:flex; gap:12px; padding:12px; border:1px solid var(--border); border-radius:14px; margin-bottom:10px;}
  .followup-row{display:flex; align-items:center; justify-content:space-between; padding:12px; border:1px solid var(--border); border-radius:14px; margin-bottom:10px;}

  /* modal */
  .modal-overlay{
    position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center; padding:16px;
    background:var(--overlay);
  }
  .modal-box{
    width:100%; max-width:520px; max-height:90vh; display:flex; flex-direction:column;
    border-radius:18px; border:1px solid var(--border); background:var(--bg-card); box-shadow:0 30px 60px rgba(0,0,0,.25);
  }
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border);}
  .modal-body{padding:20px; overflow-y:auto; display:flex; flex-direction:column; gap:16px;}
  .modal-foot{display:flex; justify-content:flex-end; align-items:center; gap:8px; padding:16px 20px; border-top:1px solid var(--border); flex-wrap:wrap;}
  .modal-foot .btn-danger-ghost{ margin-right:auto; }
  .field-label{font-size:12px; font-weight:500; color:var(--faint); display:block; margin-bottom:6px;}
  .ai-result-box{border:1px solid var(--border); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:12px;}
  .ai-result-title{font-size:12px; font-weight:600; color:var(--muted); display:flex; align-items:center; gap:6px;}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

  /* reminders */
  .chip{
    padding:6px 14px; border-radius:999px; font-size:14px; font-weight:500; border:1px solid var(--border); color:var(--muted);
  }
  .chip:hover{ background:var(--hover); }
  .chip.active{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .reminder-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px; border-bottom:1px solid var(--border);}
  .reminder-row:last-child{ border-bottom:none; }
  .reminder-row > .row-btn{ min-width:0; }
  .reminder-row > .flex{ flex-shrink:0; }

  /* settings */
  .toggle{width:48px; height:28px; border-radius:999px; padding:2px; display:flex; align-items:center; background:#cbd5e1; transition:background .15s;}
  .toggle.on{ background:var(--accent); justify-content:flex-end; }
  .toggle:not(.on){ justify-content:flex-start; }
  .toggle-dot{width:20px; height:20px; border-radius:999px; background:#fff; display:block;}
  input[type=range]{ accent-color:var(--accent); width:100%; }

  /* calendar */
  .cal-legend{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .cal-legend-item{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted);}
  .cal-dot{width:8px; height:8px; border-radius:999px;}
  .cal-grid{display:grid; grid-template-columns:1fr; gap:16px;}
  @media(min-width:1024px){ .cal-grid{grid-template-columns:2fr 1fr;} }
  .cal-weekdays{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:4px;}
  .cal-weekday{text-align:center; font-size:12px; font-weight:500; color:var(--faint); padding:6px 0;}
  .cal-days{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .cal-day{
    height:64px; border-radius:12px; border:1px solid transparent; padding:6px; display:flex; flex-direction:column;
    gap:4px; align-items:flex-start; text-align:left; transition:background .15s,border-color .15s;
  }
  @media(min-width:640px){ .cal-day{ height:80px; } }
  .cal-day:hover{ background:var(--hover); }
  .cal-day.selected{ border-color:var(--accent); background:var(--active-bg); }
  .cal-day.out{ opacity:.35; }
  .cal-day-num{
    width:20px; height:20px; border-radius:999px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:500;
  }
  .cal-day-num.today{ background:var(--accent); color:#fff; }
  .cal-dots{display:flex; flex-wrap:wrap; gap:2px;}
  .cal-dots span{width:6px; height:6px; border-radius:999px;}
  .cal-more{font-size:10px; color:var(--faint);}

  /* assistant */
  .assistant-fab{
    position:fixed; bottom:24px; right:24px; width:56px; height:56px; border-radius:999px; z-index:40;
    background:linear-gradient(135deg,#315c45,#67816b); color:#fff; display:flex; align-items:center; justify-content:center;
    box-shadow:0 16px 32px rgba(79,70,229,.35); transition:transform .15s;
  }
  .assistant-fab:hover{ transform:scale(1.06); }
  .assistant-panel{
    position:fixed; bottom:92px; right:24px; width:340px; height:480px; max-height:calc(100vh - 140px); border-radius:18px; z-index:40;
    border:1px solid var(--border); background:var(--bg-card); box-shadow:0 30px 60px rgba(0,0,0,.25);
    display:flex; flex-direction:column; overflow:hidden;
  }
  @media(max-width:420px){ .assistant-panel{ width:calc(100vw - 32px); right:16px; } }
  .assistant-head{display:flex; align-items:center; gap:8px; padding:12px 16px; border-bottom:1px solid var(--border); font-size:14px; font-weight:600;}
  .assistant-msgs{flex:1; overflow-y:auto; padding:12px 16px; display:flex; flex-direction:column; gap:10px;}
  .msg-row{display:flex;}
  .msg-row.user{ justify-content:flex-end; }
  .msg-bubble{max-width:85%; font-size:13px; padding:8px 12px; border-radius:16px; line-height:1.5;}
  .msg-bubble.ai{ background:var(--hover); color:var(--text); }
  .msg-bubble.user{ background:var(--accent); color:#fff; }
  .assistant-input-row{display:flex; align-items:center; gap:8px; padding:10px; border-top:1px solid var(--border);}
  .assistant-input-row input{ border:none; background:transparent; flex:1; }
  .assistant-input-row input:focus{ border:none; }
  .send-btn{width:32px; height:32px; border-radius:999px; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .send-btn:hover{ background:var(--accent-hover); }

  /* login */
  .login-brand{
    display:none; width:50%; position:relative; flex-direction:column; justify-content:space-between;
    padding:48px; color:#fff; overflow:hidden;
    background:linear-gradient(135deg,#4f46e5,#4338ca 45%,#5b21b6);
  }
  @media(min-width:1024px){ .login-brand{ display:flex; } }
  .login-brand-dots{
    position:absolute; inset:0; opacity:.18;
    background-image:radial-gradient(circle at 20% 20%, #fff 1px, transparent 1px);
    background-size:28px 28px;
  }
  .login-brand-mobile{ display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:32px; }
  @media(min-width:1024px){ .login-brand-mobile{ display:none; } }

  /* toast */
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:50;
    background:#0f172a; color:#fff; font-size:14px; font-weight:500; padding:10px 18px; border-radius:999px;
    box-shadow:0 20px 40px rgba(0,0,0,.25); display:flex; align-items:center; gap:8px;
  }
  body.dark .toast{ background:#1e293b; border:1px solid var(--border); }

  /* forms / dialogs */
  .modal-box.lg{ max-width:640px; }
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media(max-width:520px){ .form-grid{grid-template-columns:1fr;} }
  .form-grid .span-2{grid-column:1 / -1;}
  .form-error{
    font-size:13px; color:var(--rose); background:var(--badge-rose-bg); border:1px solid var(--badge-rose-border);
    border-radius:10px; padding:8px 12px;
  }
  .btn-danger{ background:var(--rose); color:#fff; }
  .btn-danger:hover{ opacity:.88; }
  .btn-danger-ghost{ color:var(--rose); }
  .btn-danger-ghost:hover{ background:var(--badge-rose-bg); }
  .btn-sm{ font-size:13px; padding:7px 12px; border-radius:10px; }
  .btn-xs{ font-size:12px; padding:5px 10px; border-radius:9px; }
  .tag-input-wrap{
    display:flex; flex-wrap:wrap; gap:6px; align-items:center; border:1px solid var(--border);
    border-radius:12px; padding:8px; background:var(--input-bg); min-height:42px;
  }
  .tag-input-wrap input{ border:none; padding:0; flex:1; min-width:110px; background:transparent; }
  .tag-input-wrap input:focus{ border:none; }
  .tag-chip{
    display:inline-flex; align-items:center; gap:4px; padding:3px 6px 3px 10px; border-radius:999px; font-size:11px;
    background:var(--badge-indigo-bg); color:var(--badge-indigo-text); border:1px solid var(--badge-indigo-border);
  }
  .tag-chip button{ display:flex; color:inherit; opacity:.65; }
  .tag-chip button:hover{ opacity:1; }
  .checkline{display:flex; align-items:center; gap:8px; font-size:14px; cursor:pointer;}
  .checkline input{ width:16px; height:16px; accent-color:var(--accent); }
  .hint{font-size:12px; color:var(--faint); line-height:1.6;}

  /* call overlay */
  .call-card{
    width:100%; max-width:340px; border-radius:22px; background:var(--bg-card); border:1px solid var(--border);
    box-shadow:0 30px 60px rgba(0,0,0,.3); padding:28px 24px; text-align:center;
  }
  .call-timer{ font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; margin:12px 0 4px; }
  .call-actions{display:flex; gap:10px; justify-content:center; margin-top:22px;}
  .call-pulse{
    width:88px; height:88px; border-radius:999px; margin:0 auto 14px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#315c45,#67816b); color:#fff; animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(99,102,241,.45); } 50%{ box-shadow:0 0 0 14px rgba(99,102,241,0); } }

  /* dropdown menu */
  .menu-wrap{position:relative;}
  .menu{
    position:absolute; right:0; top:calc(100% + 6px); min-width:168px; z-index:35; padding:6px;
    border-radius:14px; border:1px solid var(--border); background:var(--bg-card); box-shadow:0 20px 40px rgba(0,0,0,.18);
  }
  .menu-item{
    display:flex; align-items:center; gap:8px; width:100%; text-align:left; font-size:13px;
    padding:8px 10px; border-radius:10px; color:var(--text);
  }
  .menu-item:hover{ background:var(--hover); }
  .menu-item.danger{ color:var(--rose); }
  .menu-sep{height:1px; background:var(--border); margin:4px 0;}

  /* misc */
  .row-actions{display:flex; align-items:center; gap:6px; flex-shrink:0;}
  .quick-chips{display:flex; gap:6px; flex-wrap:wrap; padding:0 16px 10px;}
  .quick-chip{
    font-size:11px; padding:5px 10px; border-radius:999px; border:1px solid var(--border); color:var(--muted);
  }
  .quick-chip:hover{ background:var(--hover); color:var(--text); }
  .typing-dots{display:inline-flex; gap:3px; align-items:center; height:14px;}
  .typing-dots span{
    width:5px; height:5px; border-radius:999px; background:var(--faint); animation:blink 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2){ animation-delay:.18s; }
  .typing-dots span:nth-child(3){ animation-delay:.36s; }
  @keyframes blink{ 0%,80%,100%{ opacity:.25; transform:translateY(0); } 40%{ opacity:1; transform:translateY(-2px); } }
  .strike{ text-decoration:line-through; color:var(--faint); }
  .pref-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border);}
  .pref-row:last-child{ border-bottom:none; }
  .toggle-sm{width:40px; height:24px;}
  .toggle-sm .toggle-dot{width:18px; height:18px;}
  .action-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media(max-width:640px){ .action-grid{grid-template-columns:1fr;} }
  .action-tile{
    display:flex; align-items:flex-start; gap:10px; text-align:left; padding:14px;
    border:1px solid var(--border); border-radius:14px; transition:border-color .15s,background .15s;
  }
  .action-tile:hover{ border-color:var(--accent); background:var(--hover); }
  .reason-row{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--border);}
  .reason-row:last-child{ border-bottom:none; }
  .score-pill{
    font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px;
    background:var(--badge-indigo-bg); color:var(--badge-indigo-text);
  }
  .filter-tag-row{display:flex; gap:6px; flex-wrap:wrap;}
  .out-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;}
  .out-actions .btn{ background:rgba(255,255,255,.16); color:#fff; font-size:13px; padding:8px 14px; }
  .out-actions .btn:hover{ background:rgba(255,255,255,.28); }

      if(d >= 0 && d <= 7){ score += (7-d)*5; reasons.push(d===0 ? "今天生日" : `${d} 天後生日`); }
    }
    followUps.filter(f => f.customerId === c.id && f.status === "pending").forEach(f => {
      const d = daysFromToday(f.dueDate);
      if(d <= 1){
        score += d < 0 ? 60 : 40;
        reasons.push(d<0 ? `Follow Up 已逾期 ${-d} 天` : d===0 ? "Follow Up 今天到期" : "Follow Up 明天到期");
      }
    });
    if(score > 0) results.push({ customer:c, score, reasons });
  });
  return results.sort((a,b) => b.score - a.score);
}

function getReminders(customers, followUps, staleDays){
  const birthdays=[], cdMaturity=[], fundMaturity=[], etf=[], stale=[];
  customers.forEach(c => {
    const d = daysFromToday(c.birthdayDate);
    if(d >= 0 && d <= 7) birthdays.push({ customer:c, days:d });
    c.products.forEach(p => {
      if(p.maturity){
        const md = daysFromToday(p.maturity);
        if(md >= -3 && md <= 7){
          if(p.type === "定存") cdMaturity.push({ customer:c, product:p, days:md });
          if(p.type === "基金") fundMaturity.push({ customer:c, product:p, days:md });
        }
      }
      if(p.type === "ETF" && p.changePct && Math.abs(p.changePct) >= 5) etf.push({ customer:c, product:p });
    });
    const daysSince = -daysFromToday(c.lastContact);
    if(daysSince >= staleDays) stale.push({ customer:c, days:daysSince });
  });
  const pendingFollowUps = followUps.filter(f => f.status === "pending")
    .map(f => ({ followUp:f, customer:customers.find(c => c.id === f.customerId), days:daysFromToday(f.dueDate) }))
    .sort((a,b) => a.days - b.days);
  return {
    birthdays: birthdays.sort((a,b)=>a.days-b.days),
    cdMaturity: cdMaturity.sort((a,b)=>a.days-b.days),
    fundMaturity: fundMaturity.sort((a,b)=>a.days-b.days),
    etf, stale: stale.sort((a,b)=>b.days-a.days),
    followUps: pendingFollowUps,
  };
}

/* 依客戶現況推導「今天可以聊什麼」（新客戶或資料更新後可重新產生） */
function generateChatSuggestions(c){
  const out = [];
  const daysSince = -daysFromToday(c.lastContact);
  c.products.forEach(p => {
    if(p.maturity){
      const d = daysFromToday(p.maturity);
      if(d >= -30 && d <= 30){
        out.push(d <= 0
          ? `${p.name} 已於 ${p.maturity} 到期，需確認續作、轉換或贖回意願`
          : `${p.name} 將於 ${d} 天後到期，可提前討論到期後的資金安排`);
      }
    }
    if(p.changePct !== undefined && Math.abs(p.changePct) >= 3){
      out.push(`${p.name} 近期${p.changePct>0?"上漲":"下跌"} ${Math.abs(p.changePct)}%，可主動分享並討論${p.changePct>0?"是否加碼或部分獲利了結":"後續因應策略"}`);
    }
  });
  if(c.birthdayDate){
    const d = daysFromToday(c.birthdayDate);
    if(d >= 0 && d <= 14) out.push(d === 0 ? "今天是客戶生日，建議致電祝賀並趁機關心近況" : `${d} 天後是客戶生日，可安排祝賀與關心近況`);
  }
  state.followUps.filter(f => f.customerId === c.id && f.status === "pending").forEach(f => {
    out.push(`Follow Up 事項「${f.content}」預定於 ${f.dueDate}，可一併確認進度`);
  });
  if(daysSince >= state.staleDays) out.push(`已超過 ${daysSince} 天未聯繫，建議優先關心近況，避免資產流失`);
  if(c.age >= 50) out.push("客戶已邁入退休準備階段，可主動探詢退休金與傳承規劃需求");
  else if(c.age <= 35) out.push("年輕客戶可探詢長期理財目標，如購屋、進修或被動收入規劃");
  if(/子女|育有/.test(c.family || "")) out.push("客戶有子女，可延伸討論教育金與保障規劃");
  if(c.products.length === 0) out.push("客戶目前尚無持有商品，可從風險屬性出發介紹入門部位");
  if(c.tags.length > 0) out.push(`可延續客戶關注的主題切入：${c.tags.slice(0,2).join("、")}`);
  return [...new Set(out)].slice(0,4);
}
function chatSuggestionsOf(c){

/* -------------------- 提醒的忽略／延後 -------------------- */
function reminderKey(type, customerId, extra){
  return [type, customerId, extra || ""].join(":");
}
function isDismissed(key){
  const hit = state.dismissed.find(d => d.key === key);
  if(!hit) return false;
  if(!hit.until) return true;                       /* 永久忽略 */
  if(daysFromToday(hit.until) > 0) return true;     /* 延後中 */
  state.dismissed = state.dismissed.filter(d => d.key !== key);  /* 延後到期，自動恢復 */
  return false;
}
function dismissReminder(key, days){
  state.dismissed = state.dismissed.filter(d => d.key !== key);
  state.dismissed.push({ key, until: days ? addDaysStr(todayStr(), days) : null });
  state.menuOpen = null;
  saveData(); render();
  showToast(days ? `已延後 ${days} 天再提醒` : "已忽略這則提醒");
}
function restoreReminder(key){
  state.dismissed = state.dismissed.filter(d => d.key !== key);
  saveData(); render();
  showToast("已恢復提醒");
}

/* 套用「通知設定」與忽略清單後的提醒結果（全站統一使用） */
function activeReminders(){
  const r = getReminders(state.customers, state.followUps, state.staleDays);
  const p = state.prefs;
  const keep = (arr, type, extraFn) => arr.filter(x => !isDismissed(reminderKey(type, x.customer && x.customer.id, extraFn ? extraFn(x) : "")));
  return {
    birthdays:    p.birthday ? keep(r.birthdays, "birthday") : [],
    cdMaturity:   p.maturity ? keep(r.cdMaturity, "maturity", x => x.product.id) : [],
    fundMaturity: p.maturity ? keep(r.fundMaturity, "maturity", x => x.product.id) : [],
    etf:          p.etf      ? keep(r.etf, "etf", x => x.product.id) : [],
    stale:        p.stale    ? keep(r.stale, "stale") : [],
    followUps:    p.followup ? r.followUps.filter(x => x.customer && !isDismissed(reminderKey("followup", x.customer.id, x.followUp.id))) : [],
    raw: r,
  };
}
function reminderCount(){
  const r = activeReminders();
  return r.followUps.length + r.cdMaturity.length + r.fundMaturity.length + r.birthdays.length + r.stale.length + r.etf.length;
}

function generateAISummary(rawText){
  const trimmed = rawText.trim();
  const summary = trimmed.length > 0 ? trimmed.slice(0,90) + (trimmed.length>90 ? "…" : "") : "（尚未輸入通話內容）";
  const needs = [];
  if(/ETF|0050|0056|00878/.test(rawText)) needs.push("ETF加碼意願");
  if(/退休/.test(rawText)) needs.push("退休規劃需求");
  if(/基金/.test(rawText)) needs.push("基金轉換／贖回需求");
  if(/保單|保險/.test(rawText)) needs.push("保單相關需求");
  if(/定存/.test(rawText)) needs.push("定存續存意願");
  if(/教育金|子女/.test(rawText)) needs.push("子女教育金規劃");
  if(needs.length === 0) needs.push("一般關係維繫");
  const reaction = /不滿|抱怨|不高興|拒絕/.test(rawText) ? "保留" : /考慮|再想想|再看看/.test(rawText) ? "中立" : "正面";
  return { summary, needs, reaction };
}

function buildCalendarDays(year, month){
  const startWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const totalCells = Math.ceil((startWeekday + daysInMonth) / 7) * 7;
  const days = [];
  for(let i=0;i<totalCells;i++){
    const dayNum = i - startWeekday + 1;
    const d = new Date(year, month, dayNum);
    days.push({ date:d, key:toKey(d), inMonth: d.getMonth() === month });
  }
  return days;
}
const EVENT_STYLE = {
  followup: { color:"var(--accent)", badge:"indigo", label:"Follow Up" },
  birthday: { color:"var(--amber)", badge:"amber", label:"生日" },
  maturity: { color:"var(--rose)", badge:"rose", label:"商品到期" },
  call:     { color:"var(--emerald)", badge:"emerald", label:"通話紀錄" },
};
function buildCalendarEvents(customers, followUps){
  const map = {};
  const push = (dateStr, ev) => { if(!dateStr) return; if(!map[dateStr]) map[dateStr]=[]; map[dateStr].push(ev); };
  customers.forEach(c => {
    push(c.birthdayDate, { type:"birthday", customerId:c.id, text:`${c.name}・生日` });
    c.products.forEach(p => { if(p.maturity) push(p.maturity, { type:"maturity", customerId:c.id, text:`${c.name}・${p.name} 到期` }); });
    c.callLogs.forEach(log => push(log.date, { type:"call", customerId:c.id, text:`${c.name}・通話紀錄` }));
  });
  followUps.filter(f => f.status === "pending").forEach(f => {
    const c = customers.find(x => x.id === f.customerId);
    if(c) push(f.dueDate, { type:"followup", customerId:c.id, followUpId:f.id, text:`${c.name}・${f.content}` });
  });
  return map;
}

/* -------------------- 資料持久化 -------------------- */
const PERSIST_FIELDS = ["dark","profile","staleDays","prefs","dismissed","customers","followUps","todos","assistantMessages"];

let _saveTimer = null;
function saveData(){
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(() => {
    try{
      const payload = {};
      PERSIST_FIELDS.forEach(k => { payload[k] = state[k]; });
      payload._savedAt = Date.now();
      localStorage.setItem(DATA_STORAGE_KEY, JSON.stringify(payload));
    } catch {}
  }, 150);
}
function loadData(){
  let saved = null;
  try{
    const raw = localStorage.getItem(DATA_STORAGE_KEY);
    saved = raw ? JSON.parse(raw) : null;
  } catch { saved = null; }
  if(!saved) return;
  PERSIST_FIELDS.forEach(k => {
    if(saved[k] === undefined || saved[k] === null) return;
    if(k === "prefs" || k === "profile") state[k] = { ...state[k], ...saved[k] };
    else state[k] = saved[k];
  });
  state.customers.forEach(normalizeCustomer);
  state.assistantMessages = state.assistantMessages.filter(m => m && m.role && m.text);
  if(state.assistantMessages.length === 0) state.assistantMessages = [ { ...INITIAL_ASSISTANT_MSG } ];
  const maxId = Math.max(
    0,
    ...state.customers.map(c => c.id),
    ...state.followUps.map(f => f.id),
    ...state.todos.map(t => t.id),
    ...state.customers.flatMap(c => c.products.map(p => p.id)),
    ...state.customers.flatMap(c => c.callLogs.map(l => l.id)),
  );
  if(maxId > _uidSeq) _uidSeq = maxId;
}
function resetDemoData(){
  state.customers = freshCustomers();
  state.followUps = JSON.parse(JSON.stringify(INITIAL_FOLLOWUPS));
  state.todos = JSON.parse(JSON.stringify(INITIAL_TODOS));
  state.dismissed = [];
  state.staleDays = 45;
  state.prefs = { followup:true, birthday:true, maturity:true, etf:true, stale:true };
  state.assistantMessages = [ { ...INITIAL_ASSISTANT_MSG } ];
  state.selectedId = null;
  state.view = "dashboard";
  state.dialog = null;
  saveData();

}

function completeLogin(email, rememberMe){
  const authPayload = {
    email,
    name: state.profile.name || DEMO_ACCOUNT.name,
    branch: state.profile.branch || DEMO_ACCOUNT.branch,
    token: "demo-mock-token-" + Date.now(),
    rememberMe: !!rememberMe,
    loginAt: Date.now(),
  };
  try{
    if(rememberMe) localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify(authPayload));
    else localStorage.removeItem(AUTH_STORAGE_KEY);
  } catch {}
  state.authUser = authPayload;
  state.loginError = "";
  state.loginSubmitting = false;
  state.view = "dashboard";
  render();
  showToast(`歡迎回來，${authPayload.name}`);
}

function doLogin(e){
  e.preventDefault();
  if(state.loginSubmitting) return;
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const rememberMe = document.getElementById("loginRemember").checked;

  if(!email || !password){
    state.loginError = "請輸入帳號與密碼";
    renderLoginError();
    return;
  }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    state.loginError = "帳號格式需為 Email，例如 rm@bank.com";
    renderLoginError();
    return;
  }

  /* 模擬送出驗證請求 */
  state.loginError = "";
  state.loginSubmitting = true;
  renderLoginError();
  setLoginBusy(true);

  setTimeout(() => {
    if(email === DEMO_ACCOUNT.email && password === DEMO_ACCOUNT.password){
      completeLogin(email, rememberMe);
    } else {
      state.loginSubmitting = false;
      state.loginError = "帳號或密碼錯誤，請確認後再試一次";
      setLoginBusy(false);
      renderLoginError();
    }
  }, 650);
}
function setLoginBusy(busy){
  const btn = document.getElementById("loginSubmit");
  if(!btn) return;
  btn.disabled = busy;
  btn.innerHTML = busy ? icon("loader",16) + "登入中…" : "登入";
}
function renderLoginError(){
  const el = document.getElementById("loginErrorWrap");
  if(el) el.innerHTML = state.loginError
    ? `<p role="alert" class="form-error">${esc(state.loginError)}</p>` : "";
}
function toggleLoginPassword(){
  const input = document.getElementById("loginPassword");
  if(!input) return;
  state.showPassword = !state.showPassword;
  input.type = state.showPassword ? "text" : "password";
  const btn = document.getElementById("pwToggle");
  if(btn) btn.innerHTML = icon(state.showPassword ? "eyeOff" : "eye", 16);
}

function logout(){
  if(state.dialog) closeDialog();
  try{ localStorage.removeItem(AUTH_STORAGE_KEY); } catch {}
  state.authUser = null;
  state.view = "dashboard";
  state.selectedId = null;

}

function filteredCustomers(){
  const { q, risk, tag, sort } = state.custFilter;
  const kw = q.trim().toLowerCase();
  let list = state.customers.filter(c => {
    if(!kw) return true;
    return [c.name, c.occupation, c.phone, c.email, c.note, ...c.tags]
      .filter(Boolean).some(v => String(v).toLowerCase().includes(kw));
  });
  if(risk !== "全部") list = list.filter(c => c.risk === risk);
  if(tag !== "全部") list = list.filter(c => c.tags.includes(tag));
  if(sort === "資產規模") list = [...list].sort((a,b) => b.asset - a.asset);
  if(sort === "最近聯絡") list = [...list].sort((a,b) => daysFromToday(a.lastContact) - daysFromToday(b.lastContact));
  if(sort === "姓名") list = [...list].sort((a,b) => a.name.localeCompare(b.name, "zh-Hant"));
  return list;
}
function renderCustomerRows(list){
  if(list.length === 0) return `<tr><td colspan="6"><div class="empty-row">沒有符合條件的客戶</div></td></tr>`;
  return list.map(c => {
    const days = -daysFromToday(c.lastContact);
    return `
      <tr>
        <td><div class="flex items-center gap-3">${avatarHTML(c.name,"sm")}<div><p class="font-medium cust-name">${esc(c.name)}</p><p class="text-xs faint cust-meta">${c.age} 歲・${esc(c.occupation)}</p></div></div></td>
        <td class="col-hide-sm">${fmtMoney(c.asset)}</td>
        <td class="col-hide-md">${badgeHTML(c.risk+" · "+c.style, riskColor(c.risk))}</td>
        <td class="col-hide-lg" style="${days>=state.staleDays?"color:var(--rose);font-weight:500;":"color:var(--muted);"}">${days} 天前</td>
        <td><div class="flex gap-1 flex-wrap">${c.tags.slice(0,2).map(t=>badgeHTML(esc(t),"indigo")).join("")}</div></td>
        <td style="text-align:right;">
          <div class="row-actions" style="justify-content:flex-end;">
            <button class="icon-btn only-md" style="width:30px;height:30px;" title="撥打電話" onclick="startCall(${c.id})">${icon("phone",14)}</button>
            <button class="icon-btn only-md" style="width:30px;height:30px;" title="編輯客戶" onclick="openDialog({type:'customer',id:${c.id}})">${icon("edit",14)}</button>
            <button class="link-btn" onclick="openCustomer(${c.id})">查看 ${icon("chevronRight",14)}</button>
          </div>
        </td>
      </tr>`;
  }).join("");
}
function refreshCustomerTable(){
  const wrap = document.getElementById("custTbody");
  if(wrap) wrap.innerHTML = renderCustomerRows(filteredCustomers());
  const cnt = document.getElementById("custCount");
  if(cnt) cnt.textContent = `${filteredCustomers().length} / ${state.customers.length} 位`;
}
function updateCustFilter(field, value){
  state.custFilter[field] = value;
  refreshCustomerTable();
}
function exportCustomersCSV(){
  const header = ["姓名","年齡","職業","家庭狀況","電話","Email","資產規模(萬)","投資屬性","風險屬性","最近聯絡","生日","標籤","備註"];
  const rows = filteredCustomers().map(c => [
    c.name, c.age, c.occupation, c.family, c.phone, c.email, c.asset, c.style, c.risk,
    c.lastContact, c.birthdayDate || "", c.tags.join(" / "), (c.note||"").replace(/\r?\n/g," "),
  ]);
  const csv = [header, ...rows]
    .map(r => r.map(v => `"${String(v == null ? "" : v).replace(/"/g,'""')}"`).join(","))
    .join("\r\n");
  download(`客戶名單_${todayStr()}.csv`, "﻿" + csv, "text/csv;charset=utf-8");
  showToast(`已匯出 ${rows.length} 位客戶`);
}

let remindersTab = "all";
function setRemindersTab(t){ remindersTab = t; render(); }

function reminderRows(){
  const reminders = activeReminders();
  const rows = [];
  reminders.followUps.forEach(r => rows.push({ type:"followup", customer:r.customer, days:r.days, text:r.followUp.content, followUpId:r.followUp.id, key:reminderKey("followup", r.customer.id, r.followUp.id) }));
  reminders.birthdays.forEach(r => rows.push({ type:"birthday", customer:r.customer, days:r.days, text:`生日提醒（${r.customer.birthdayDate}）`, key:reminderKey("birthday", r.customer.id) }));
  reminders.cdMaturity.forEach(r => rows.push({ type:"maturity", customer:r.customer, days:r.days, text:`定存到期：${r.product.name}・${fmtMoney(r.product.amount)}`, key:reminderKey("maturity", r.customer.id, r.product.id) }));
  reminders.fundMaturity.forEach(r => rows.push({ type:"maturity", customer:r.customer, days:r.days, text:`基金到期：${r.product.name}・${fmtMoney(r.product.amount)}`, key:reminderKey("maturity", r.customer.id, r.product.id) }));
  reminders.etf.forEach(r => rows.push({ type:"etf", customer:r.customer, days:0, text:`${r.product.name} 近期${r.product.changePct>0?"上漲":"下跌"} ${Math.abs(r.product.changePct)}%`, key:reminderKey("etf", r.customer.id, r.product.id) }));
  reminders.stale.forEach(r => rows.push({ type:"stale", customer:r.customer, days:-r.days, text:`已 ${r.days} 天未聯繫`, key:reminderKey("stale", r.customer.id) }));
  rows.sort((a,b) => a.days - b.days);
  return rows;
}

function renderReminders(){
  const rows = reminderRows();
  const counts = rows.reduce((m,r) => { m[r.type] = (m[r.type]||0)+1; return m; }, {});
  const tabs = [["all","全部"],["followup","Follow Up"],["birthday","生日"],["maturity","商品到期"],["etf","ETF 波動"],["stale","久未聯繫"]];
  const filtered = remindersTab==="all" ? rows : rows.filter(r => r.type===remindersTab);

  const urgency = (r) => {
    const days = r.days;
    if(r.type === "etf") return { color:"amber", label:"需關注" };
    if(r.type === "stale") return { color:-days >= 60 ? "rose" : "amber", label:`${-days} 天未聯繫` };
    if(days < 0) return { color:"rose", label:`已逾期 ${-days} 天` };
    if(days === 0) return { color:"rose", label:"今天" };
    if(days <= 3) return { color:"amber", label:relativeDay(days) };
    return { color:"slate", label:relativeDay(days) };
  };

  const rowsHTML = filtered.length===0 ? `<div class="empty-row">這個分類目前沒有提醒</div>` :
    filtered.map(r => {
      const u = urgency(r);
      const menuId = "rm:" + r.key;
      const menu = state.menuOpen === menuId ? `
        <div class="menu" onclick="event.stopPropagation()">
          ${r.type==="followup" ? `<button class="menu-item" onclick="completeFollowUp(${r.followUpId})">${icon("checkCircle",15)}標記完成</button>` : ""}
          <button class="menu-item" onclick="startCall(${r.customer.id})">${icon("phone",15)}立即撥打</button>
          <button class="menu-item" onclick="openDialog({type:'todo',customerId:${r.customer.id}})">${icon("clock",15)}排入今日待辦</button>
          <div class="menu-sep"></div>
          <button class="menu-item" onclick="dismissReminder('${esc(r.key)}',3)">${icon("clock",15)}延後 3 天</button>
          <button class="menu-item" onclick="dismissReminder('${esc(r.key)}',7)">${icon("clock",15)}延後 7 天</button>
          <button class="menu-item danger" onclick="dismissReminder('${esc(r.key)}',0)">${icon("x",15)}忽略此提醒</button>
        </div>` : "";
      return `
        <div class="reminder-row">
          <button class="row-btn" style="padding:0;" onclick="openCustomer(${r.customer.id})">
            ${avatarHTML(r.customer.name,"sm")}
            <div class="min-w-0"><p class="text-sm font-medium">${esc(r.customer.name)}</p><p class="text-xs muted truncate">${esc(r.text)}</p></div>
          </button>
          <div class="flex items-center gap-2">
            ${badgeHTML(u.label, u.color)}
            ${r.type==="followup"?`<button class="link-btn" style="font-size:12px;" onclick="completeFollowUp(${r.followUpId})">標記完成</button>`:""}
            <div class="menu-wrap">
              <button class="icon-btn" style="width:30px;height:30px;" title="更多操作" onclick="event.stopPropagation();toggleMenu('${esc(menuId)}')">${icon("more",16)}</button>
              ${menu}
            </div>
          </div>
        </div>`;
    }).join("");

  const dismissedList = state.dismissed.filter(d => !d.until || daysFromToday(d.until) > 0);
  const dismissedHTML = !state.showDismissed || dismissedList.length===0 ? "" : `
    <div class="card card-flat">
      <div style="padding:14px 16px;border-bottom:1px solid var(--border);" class="text-xs font-semibold muted">已忽略／延後中（${dismissedList.length}）</div>
      ${dismissedList.map(d => {
        const [type, cid] = d.key.split(":");
        const c = findCustomer(Number(cid));
        const typeLabel = { followup:"Follow Up", birthday:"生日", maturity:"商品到期", etf:"ETF 波動", stale:"久未聯繫" }[type] || type;
        return `
        <div class="reminder-row">
          <div class="flex items-center gap-3 min-w-0">
            ${c?avatarHTML(c.name,"sm"):""}
            <div class="min-w-0">
              <p class="text-sm font-medium">${esc(c?c.name:"（已刪除客戶）")}</p>
              <p class="text-xs muted">${esc(typeLabel)}・${d.until?`延後至 ${esc(d.until)}`:"永久忽略"}</p>
            </div>
          </div>
          <button class="btn btn-ghost btn-xs" onclick="restoreReminder('${esc(d.key)}')">${icon("undo",13)}恢復提醒</button>
        </div>`;
      }).join("")}
    </div>`;

  return `
    <div class="flex-col gap-4">
      <div class="flex items-center justify-between flex-wrap gap-3">
        <div>
          <h2 class="text-xl font-semibold" style="margin:0;">提醒中心</h2>
          <p class="text-xs faint mt-1">共 ${rows.length} 則待處理提醒・可於設定頁調整提醒類型</p>
        </div>
        <div class="flex gap-2">
          ${dismissedList.length>0 ? `<button class="btn btn-outline btn-sm" onclick="toggleShowDismissed()">${icon(state.showDismissed?"eyeOff":"eye",15)}${state.showDismissed?"隱藏":"顯示"}已忽略（${dismissedList.length}）</button>` : ""}
          <button class="btn btn-outline btn-sm" onclick="setView('settings')">${icon("settings",15)}提醒設定</button>
        </div>
      </div>
      <div class="flex gap-2 flex-wrap">
        ${tabs.map(([k,l]) => {
          const n = k==="all" ? rows.length : (counts[k]||0);
          return `<button class="chip ${remindersTab===k?"active":""}" onclick="setRemindersTab('${k}')">${l}${n?` ${n}`:""}</button>`;
        }).join("")}
      </div>
      <div class="card card-flat">${rowsHTML}</div>
      ${dismissedHTML}
    </div>`;
}

function exportBackup(){
  const payload = {};
  PERSIST_FIELDS.forEach(k => { payload[k] = state[k]; });
  payload._exportedAt = new Date().toISOString();
  payload._app = "ai-relationship-manager";
  download(`AI理專助理備份_${todayStr()}.json`, JSON.stringify(payload, null, 2), "application/json");
  showToast("已匯出備份檔");
}
function importBackup(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(String(reader.result));
      if(!data || !Array.isArray(data.customers)) throw new Error("格式不符");
      PERSIST_FIELDS.forEach(k => {
        if(data[k] === undefined || data[k] === null) return;
        if(k === "prefs" || k === "profile") state[k] = { ...state[k], ...data[k] };
        else state[k] = data[k];
      });
      state.customers.forEach(normalizeCustomer);
      _uidSeq = Math.max(_uidSeq, Date.now());
      saveData(); render();
      showToast(`已匯入 ${state.customers.length} 位客戶資料`);
    } catch(err){
      showToast("匯入失敗：檔案格式不正確");
    }
    input.value = "";
  };
  reader.onerror = () => { showToast("讀取檔案失敗"); input.value = ""; };
  reader.readAsText(file);
}

const AI_ACTIONS = [
  { key:"analyze", label:"分析客戶", icon:"users" },
  { key:"opener", label:"產生聊天開場", icon:"message" },
  { key:"allocation", label:"分析資產配置", icon:"wallet" },
  { key:"risk", label:"分析客戶風險", icon:"trending" },
  { key:"product", label:"推薦適合商品", icon:"sparkles" },
  { key:"followup", label:"產生 Follow Up 建議", icon:"clock" },
];

function generateAIAnalysis(customer, type){
  if(!customer) return "";
  const totalAmt = customer.products.reduce((s,p)=>s+Number(p.amount||0),0);
  const byType = {};
  customer.products.forEach(p => { byType[p.type] = (byType[p.type]||0) + Number(p.amount||0); });
  const allocLines = Object.entries(byType).map(([t,amt]) => `${t} ${fmtMoney(amt)}（約 ${totalAmt?Math.round(amt/totalAmt*100):0}%）`).join("、");

  if(type === "analyze"){
    return `${customer.name}（${customer.age}歲・${customer.occupation}）目前資產規模約 ${fmtMoney(customer.asset)}，風險屬性 ${customer.risk}／${customer.style}。`
      + `根據近 ${customer.callLogs.length} 次通話紀錄，AI 歸納出的標籤為：${customer.tags.join("、")}。`
      + `${customer.note} 建議下次聯繫時延續這個方向切入，會比從零開始更容易建立信任感。`;
  }
  if(type === "opener"){
    const list = chatSuggestionsOf(customer);
    return list.length ? list.map((s,i)=>`${i+1}. ${s}`).join("\n")
      : `${customer.name} 目前資料較少，建議先從關心近況、確認理財目標開始，並在通話後補齊持有商品與需求紀錄。`;
  }
  if(type === "allocation"){
    if(customer.products.length === 0) return `${customer.name} 目前尚無登錄任何持有商品，建議先了解其他行庫的既有部位，再規劃整體資產配置。`;
    return `${customer.name} 目前持有商品總額約 ${fmtMoney(totalAmt)}：${allocLines}。`
      + (Object.keys(byType).length <= 1
          ? " 目前配置較集中在單一類型商品，可評估是否適度分散以降低集中度風險。"
          : " 配置涵蓋多種商品類型，屬於相對分散的組合，可視市場狀況微調比重。");
  }
  if(type === "risk"){
    const riskNote = {
      RR2:"風險承受度偏保守，適合以保本、穩定收益型商品為主，避免高波動部位占比過高。",
      RR3:"風險承受度中等，可在核心穩健部位之外，搭配少量成長型資產拉高報酬空間。",
      RR4:"風險承受度中高，具備一定的波動承受能力，可適度提高股票／ETF部位。",
      RR5:"風險承受度高，可承受較大波動，但仍建議定期檢視部位集中度，避免單一標的曝險過高。",
    };
    return `${customer.name} 的風險屬性為 ${customer.risk}（${customer.style}）。${riskNote[customer.risk]||""}`;
  }
  if(type === "product"){
    const hasETF = customer.products.some(p=>p.type==="ETF");
    const hasFund = customer.products.some(p=>p.type==="基金");
    const hasCD = customer.products.some(p=>p.type==="定存");
    const recs = [];
    if(customer.risk==="RR2") recs.push("高利活存／短天期定存", "保本型結構商品");
    else if(customer.risk==="RR3") recs.push("平衡型基金", "投資等級債券ETF");
    else recs.push("高股息ETF", "全球型股票基金");
    if(!hasETF) recs.push("可介紹一檔核心市值型ETF作為入門部位");
    if(hasCD && !hasFund) recs.push("定存到期時可討論轉換部分資金至穩健型基金，爭取更高報酬");
    return `根據 ${customer.name} 的風險屬性與現有持有商品，建議可介紹：${recs.join("、")}。`;
  }
  if(type === "followup"){
    const pending = state.followUps.filter(f=>f.customerId===customer.id && f.status==="pending");
    if(pending.length>0){
      return `${customer.name} 目前有 ${pending.length} 筆待處理 Follow Up：${pending.map(f=>f.content).join("、")}。建議本週優先處理，避免逾期影響客戶信任感。`;
    }
    return `${customer.name} 目前沒有待處理的 Follow Up。建議可依「今天可以聊什麼」的建議主動安排下一次聯繫，並在通話後建立新的 Follow Up 追蹤。`;
  }
  return "";
}

function runDailyBriefing(){
  const suggestions = getSuggestions(state.customers, state.followUps, state.staleDays);
  const r = activeReminders();
  const lines = [];
  lines.push(`【${todayStr()} 今日行動清單】`);
  lines.push("");
  if(suggestions.length === 0){
    lines.push("今天沒有緊急待辦，建議安排例行關係維繫聯繫。");
  } else {
    lines.push(`■ 優先聯繫（依 AI 計分排序，共 ${suggestions.length} 位）`);
    suggestions.slice(0,6).forEach((s,i) => {
      lines.push(`${i+1}. ${s.customer.name}（${s.customer.risk}／${fmtMoney(s.customer.asset)}）`);
      s.reasons.forEach(rs => lines.push(`   · ${rs}`));
      lines.push(`   · 建議切入：${chatSuggestionsOf(s.customer)[0] || "關心近況"}`);
    });
  }
  if(r.followUps.length){
    lines.push("");
    lines.push("■ Follow Up 待處理");
    r.followUps.forEach(f => lines.push(`· ${f.customer.name}：${f.followUp.content}（${f.dueDate || f.followUp.dueDate}，${relativeDay(f.days)}）`));
  }
  if(r.cdMaturity.length || r.fundMaturity.length){
    lines.push("");
    lines.push("■ 商品到期");
    [...r.cdMaturity, ...r.fundMaturity].forEach(m => lines.push(`· ${m.customer.name}：${m.product.name} ${fmtMoney(m.product.amount)}（${relativeDay(m.days)}）`));
  }
  if(r.birthdays.length){
    lines.push("");
    lines.push("■ 生日祝賀");
    r.birthdays.forEach(b => lines.push(`· ${b.customer.name}（${relativeDay(b.days)}）`));
  }
  if(r.stale.length){
    lines.push("");
    lines.push("■ 久未聯繫（超過 " + state.staleDays + " 天）");
    r.stale.forEach(s => lines.push(`· ${s.customer.name}：已 ${s.days} 天未聯繫`));
  }
  state.aiConsole.type = "daily";
  state.aiConsole.title = "今日行動清單";
  state.aiConsole.output = lines.join("\n");
  state.view = "ai";
  render();
}

function renderCalendar(){
  const events = buildCalendarEvents(state.customers, state.followUps);
  const days = buildCalendarDays(state.cal.year, state.cal.month);
  const todayKey = toKey(TODAY);

  const legend = Object.entries(EVENT_STYLE).map(([k,s]) =>
    `<span class="cal-legend-item"><span class="cal-dot" style="background:${s.color}"></span>${s.label}</span>`).join("");

  const weekdayRow = WEEKDAYS.map(w => `<div class="cal-weekday">${w}</div>`).join("");
  const dayCells = days.map(d => {
    const evs = events[d.key] || [];
    const isToday = d.key === todayKey;
    const isSelected = d.key === state.cal.selectedKey;
    const dots = evs.slice(0,3).map(ev => `<span style="background:${EVENT_STYLE[ev.type].color}"></span>`).join("");
    const more = evs.length>3 ? `<span class="cal-more">+${evs.length-3}</span>` : "";
    return `
      <button class="cal-day ${isSelected?"selected":""} ${!d.inMonth?"out":""}" onclick="selectCalDay('${d.key}')">
        <span class="cal-day-num ${isToday?"today":""}">${d.date.getDate()}</span>
        <div class="cal-dots">${dots}${more}</div>
      </button>`;
  }).join("");

  const selEvents = events[state.cal.selectedKey] || [];
  const selDate = new Date(state.cal.selectedKey+"T00:00:00");
  const selLabel = `${selDate.getMonth()+1} 月 ${selDate.getDate()} 日`;
  const eventList = selEvents.length===0 ? `<div class="empty-row">這天沒有排定的事件</div>` :
    selEvents.map(ev => {
      const s = EVENT_STYLE[ev.type];
      const c = findCustomer(ev.customerId);
      if(!c) return "";
      return `
        <div class="row-btn" style="align-items:flex-start;">
          <button style="display:flex;gap:12px;flex:1;min-width:0;text-align:left;align-items:flex-start;" onclick="openCustomer(${ev.customerId})">
            ${avatarHTML(c.name,"sm")}
            <div class="min-w-0 flex-1">
              <div class="flex items-center justify-between gap-2"><p class="text-sm font-medium truncate">${esc(c.name)}</p>${badgeHTML(s.label, s.badge)}</div>
              <p class="text-xs muted mt-1">${esc(ev.text)}</p>
            </div>
          </button>
          ${ev.followUpId ? `<button class="icon-btn" style="width:28px;height:28px;" title="標記完成" onclick="completeFollowUp(${ev.followUpId})">${icon("checkCircle",15)}</button>` : ""}
        </div>`;
    }).join("");

  /* 本月事件統計 */
  const monthPrefix = `${state.cal.year}-${pad2(state.cal.month+1)}`;
  const monthCounts = {};
  Object.entries(events).forEach(([k, evs]) => {
    if(!k.startsWith(monthPrefix)) return;
    evs.forEach(ev => { monthCounts[ev.type] = (monthCounts[ev.type]||0) + 1; });
  });

  return `
    <div class="flex-col gap-4">
      <div class="flex items-center justify-between flex-wrap gap-3">
        <h2 class="text-xl font-semibold" style="margin:0;">行事曆</h2>
        <div class="cal-legend">${legend}</div>
      </div>
      <div class="cal-grid">
        <div class="card">
          <div class="flex items-center justify-between mb-4">
            <p class="text-base font-semibold">${state.cal.year} 年 ${state.cal.month+1} 月</p>
            <div class="flex items-center gap-1">
              <button class="icon-btn" onclick="changeCalMonth(-1)">${icon("chevronLeft",16)}</button>
              <button class="btn btn-ghost" style="font-size:12px;padding:6px 12px;" onclick="gotoCalToday()">回到今天</button>
              <button class="icon-btn" onclick="changeCalMonth(1)">${icon("chevronRight",16)}</button>
            </div>
          </div>
          <div class="cal-weekdays">${weekdayRow}</div>
          <div class="cal-days">${dayCells}</div>
          <div class="flex gap-3 flex-wrap mt-4 text-xs muted">
            ${Object.entries(EVENT_STYLE).map(([k,s]) => `<span>${s.label}：${monthCounts[k]||0}</span>`).join("")}
          </div>
        </div>
        <div class="card">
          <div class="section-title">
            <div class="section-title-left">${icon("calendar",16)}<h3>${selLabel} 的行程（${selEvents.length}）</h3></div>
            <button class="btn btn-outline btn-xs" onclick="openDialog({type:'followup',presetDate:'${state.cal.selectedKey}'})">${icon("plus",13)}新增</button>
          </div>
          <div class="flex-col gap-1" style="max-height:384px;overflow-y:auto;">${eventList}</div>
        </div>
      </div>
    </div>`;
}

function runAI(){
  const raw = val("clRaw");
  if(!raw){
    setDialogError("請先輸入通話內容，AI 才能整理摘要");
    return;
  }
  setDialogError("");
  const btn = document.getElementById("aiBtn");
  btn.disabled = true;
  btn.innerHTML = icon("loader",16) + "AI 整理中…";
  setTimeout(() => {
    const r = generateAISummary(raw);
    document.getElementById("clSummary").value = r.summary;
    document.getElementById("clNeeds").value = r.needs.join("、");
    document.getElementById("clReaction").value = r.reaction;
    const followUpEl = document.getElementById("clFollowUp");
    if(!followUpEl.value) followUpEl.value = `${r.needs[0]}：後續追蹤與確認`;
    btn.disabled = false;
    btn.innerHTML = icon("sparkles",16) + "AI 整理摘要";
    showToast("AI 已整理摘要，可再手動調整");
  }, 700);
}

function saveCallLog(customerId, logId){
  const c = findCustomer(customerId);
  if(!c) return;
  const date = val("clDate");
  const summary = val("clSummary");
  if(!isValidDateStr(date)) return setDialogError("請選擇正確的通話日期");
  if(!summary) return setDialogError("請輸入摘要，或先用「AI 整理摘要」產生");

  const needs = val("clNeeds").split(/[、,]/).map(s=>s.trim()).filter(Boolean);
  const reaction = val("clReaction");
  const nextContact = val("clNext");
  const followUp = val("clFollowUp");
  const durationText = val("clDuration");

  if(logId){
    const log = c.callLogs.find(l => l.id === logId);
    Object.assign(log, { date, summary, needs, reaction, nextContact, followUp, durationText });
    closeDialog(); saveData();
    showToast("已更新通話紀錄");
    return;
  }

  c.callLogs.push({ id:uid(), date, summary, needs, reaction, nextContact, followUp, durationText });
  if(checked("clUpdateContact")) c.lastContact = date;

  let madeFollowUp = false;
  if(checked("clMakeFollowUp") && followUp && isValidDateStr(nextContact)){
    state.followUps.push({ id:uid(), customerId:c.id, dueDate:nextContact, content:followUp, status:"pending" });
    madeFollowUp = true;
  }
  c.chatSuggestions = generateChatSuggestions(c);

  closeDialog(); saveData();
  showToast(madeFollowUp ? "已儲存通話紀錄，並建立 Follow Up" : "已儲存通話紀錄");
}

function deleteCallLog(customerId, logId){
  const c = findCustomer(customerId);
  if(!c) return;
  c.callLogs = c.callLogs.filter(l => l.id !== logId);
  c.chatSuggestions = generateChatSuggestions(c);
  state.dialog = null;
  saveData(); render();
  showToast("已刪除通話紀錄");
}

  if(!(asset >= 0) || val("cfAsset") === "") return setDialogError("請輸入正確的資產規模（數字，單位：萬）");
  const age = Number(val("cfAge")) || 0;
  const birthdayDate = val("cfBirthday");
  const lastContact = val("cfLast") || todayStr();
  if(birthdayDate && !isValidDateStr(birthdayDate)) return setDialogError("生日格式不正確");
  if(!isValidDateStr(lastContact)) return setDialogError("最近聯絡日期格式不正確");

  const payload = {
    name, age, occupation: val("cfOcc") || "未填寫", family: val("cfFamily"),
    phone: val("cfPhone"), email: val("cfEmail"),
    asset, style: val("cfStyle"), risk: val("cfRisk"),
    birthdayDate, lastContact, note: val("cfNote"),
    tags: [...state.dialog.tags],
  };

  if(id){
    const c = findCustomer(id);
    if(!c) return setDialogError("找不到客戶資料");
    Object.assign(c, payload);
    if(!c.chatSuggestions.length) c.chatSuggestions = generateChatSuggestions(c);
    closeDialog(); saveData();
    showToast(`已更新 ${name} 的資料`);
  } else {
    const c = normalizeCustomer({ id:uid(), ...payload, joinedDate:todayStr(), products:[], callLogs:[], chatSuggestions:[] });
    c.chatSuggestions = generateChatSuggestions(c);
    state.customers.push(c);
    state.dialog = null;
    state.selectedId = c.id;
    state.view = "customerDetail";
    detailTab = "basic";
    saveData(); render();
    showToast(`已新增客戶 ${name}`);
  }
}

  const c = findCustomer(customerId);
  if(!c) return;
  const name = val("pfName");
  if(!name) return setDialogError("請輸入商品名稱");
  if(val("pfAmount") === "" || !(Number(val("pfAmount")) >= 0)) return setDialogError("請輸入正確的金額（單位：萬）");
  const maturity = val("pfMaturity");
  if(maturity && !isValidDateStr(maturity)) return setDialogError("到期日格式不正確");
  const changeRaw = val("pfChange");

  const payload = { type: val("pfType"), name, amount: Number(val("pfAmount")) };
  if(maturity) payload.maturity = maturity;
  if(changeRaw !== "" && !isNaN(Number(changeRaw))) payload.changePct = Number(changeRaw);

  if(productId){
    const p = c.products.find(x => x.id === productId);
    delete p.maturity; delete p.changePct;
    Object.assign(p, payload);
    showToast("已更新持有商品");
  } else {
    c.products.push({ id:uid(), ...payload });
    showToast(`已為 ${c.name} 新增持有商品`);
  }
  c.chatSuggestions = generateChatSuggestions(c);
  closeDialog(); saveData();
}
function deleteProduct(customerId, productId){
  const c = findCustomer(customerId);
  if(!c) return;
  const p = c.products.find(x => x.id === productId);
  c.products = c.products.filter(x => x.id !== productId);
  c.chatSuggestions = generateChatSuggestions(c);
  state.dialog = null;
  saveData(); render();
  showToast(`已刪除商品${p?`「${p.name}」`:""}`);
}

function generateTodosFromAI(){
  const suggestions = getSuggestions(state.customers, state.followUps, state.staleDays).slice(0,5);
  if(suggestions.length === 0){ showToast("今天沒有需要優先聯繫的客戶"); return; }
  let added = 0;
  suggestions.forEach((s,i) => {
    if(state.todos.some(t => t.customerId === s.customer.id)) return;
    state.todos.push({ id:uid(), customerId:s.customer.id, note:s.reasons[0], time:`${pad2(9+i)}:30`, done:false });
    added++;
  });
  saveData(); render();
  showToast(added ? `已排入 ${added} 筆待辦` : "建議客戶都已在待辦清單中");
}

  clearInterval(state.callTimer);
  state.callTimer = setInterval(() => {

    const el = document.getElementById("callTimer");
    if(el) el.textContent = `${pad2(Math.floor(state.callSeconds/60))}:${pad2(state.callSeconds%60)}`;

  clearInterval(state.callTimer);

  const customerId = state.dialog ? state.dialog.customerId : null;
  const durationText = `${pad2(Math.floor(state.callSeconds/60))}:${pad2(state.callSeconds%60)}`;

  if(withLog && customerId){
    openDialog({ type:"calllog", customerId, date:todayStr(), durationText });
    showToast(`通話結束（${durationText}）`);
  } else {
    closeDialog();
    if(seconds > 0) showToast("已結束通話");
  }
}

function answerAssistant(q){
  const matched = state.customers.find(c => q.includes(c.name));
  const r = activeReminders();

  if(/^(help|你會什麼|功能|能問|可以問|幫助)/.test(q) || /我能問你什麼/.test(q)){
    return "我可以幫你：\n・查客戶近況：「王小明上次聊了什麼？」\n・盤點今日重點：「今天該聯繫誰？」\n・查提醒：「有誰快生日？」「哪些商品要到期？」「有誰久未聯繫？」\n・看待辦與 Follow Up：「今天的待辦」「有哪些逾期事項？」\n・看資產排行與統計：「資產排行」「總共有幾位客戶？」\n・直接動作：「幫我建立林淑芬的待辦」";
  }
  /* 動作：建立待辦 */
  if(/建立.*待辦|新增.*待辦|排.*待辦|提醒我聯繫/.test(q)){
    if(!matched) return "請告訴我要為哪一位客戶建立待辦，例如「幫我建立林淑芬的待辦」。";
    if(state.todos.some(t => t.customerId === matched.id)) return `${matched.name} 已經在今日待辦清單中了。`;
    state.todos.push({ id:uid(), customerId:matched.id, note:chatSuggestionsOf(matched)[0] || "關心近況", time:"10:00", done:false });
    saveData();
    return `已把 ${matched.name} 排入今日待辦（10:00）。建議切入：${chatSuggestionsOf(matched)[0] || "關心近況"}`;
  }
  /* 特定客戶 */
  if(matched){
    const lastLog = [...matched.callLogs].sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0];
    const pending = state.followUps.filter(f => f.customerId === matched.id && f.status === "pending");
    const lines = [];
    lines.push(lastLog
      ? `${matched.name} 上次於 ${lastLog.date} 通話，摘要：「${lastLog.summary}」客戶反應為${lastLog.reaction}。`
      : `${matched.name} 目前尚無通話紀錄。`);
    lines.push(`資產 ${fmtMoney(matched.asset)}・${matched.risk}／${matched.style}・已 ${-daysFromToday(matched.lastContact)} 天未聯繫。`);
    if(matched.tags.length) lines.push(`標籤：${matched.tags.join("、")}`);
    if(pending.length) lines.push(`待處理 Follow Up：${pending.map(f=>`${f.content}（${f.dueDate}）`).join("、")}`);
    const tip = chatSuggestionsOf(matched)[0];
    if(tip) lines.push(`建議切入：${tip}`);
    return lines.join("\n");
  }
  /* 今日優先 */
  if(/今天.*(聯繫|聯絡|誰|重點)|該聯繫|優先|建議聯絡/.test(q)){
    const s = getSuggestions(state.customers, state.followUps, state.staleDays).slice(0,5);
    if(!s.length) return "今天沒有特別緊急的客戶，適合安排例行關係維繫。";
    return "今天建議優先聯繫：\n" + s.map((x,i)=>`${i+1}. ${x.customer.name}（${x.reasons[0]}）`).join("\n");
  }
  /* 生日 */
  if(/生日/.test(q)){
    if(!r.birthdays.length) return "未來 7 天內沒有客戶生日。";
    return "近期生日：\n" + r.birthdays.map(b=>`・${b.customer.name}（${b.customer.birthdayDate}，${relativeDay(b.days)}）`).join("\n");
  }
  /* 到期 */
  if(/到期|續存|贖回/.test(q)){
    const all = [...r.cdMaturity, ...r.fundMaturity];
    if(!all.length) return "近期沒有商品到期。";
    return "近期到期商品：\n" + all.map(m=>`・${m.customer.name}：${m.product.name} ${fmtMoney(m.product.amount)}（${relativeDay(m.days)}）`).join("\n");
  }
  /* 久未聯繫 */
  if(/久未|沒聯繫|未聯繫|流失/.test(q)){
    if(!r.stale.length) return `目前沒有超過 ${state.staleDays} 天未聯繫的客戶。`;
    return `超過 ${state.staleDays} 天未聯繫：\n` + r.stale.map(s=>`・${s.customer.name}（已 ${s.days} 天）`).join("\n");
  }
  /* Follow Up */
  if(/follow|逾期|待處理|追蹤事項/i.test(q)){
    if(!r.followUps.length) return "目前沒有待處理的 Follow Up。";
    return "待處理 Follow Up：\n" + r.followUps.map(f=>`・${f.customer.name}：${f.followUp.content}（${relativeDay(f.days)}）`).join("\n");
  }
  /* 待辦 */
  if(/待辦|todo|行程/i.test(q)){
    if(!state.todos.length) return "今天還沒有安排待辦，可以說「幫我建立王小明的待辦」。";
    const done = state.todos.filter(t=>t.done).length;
    return `今日待辦（${done}/${state.todos.length} 已完成）：\n` + [...state.todos]
      .sort((a,b)=>String(a.time).localeCompare(String(b.time)))
      .map(t => {
        const c = t.customerId ? findCustomer(t.customerId) : null;
        return `・${t.time} ${c?c.name:(t.note||"自訂事項")}${t.done?"（已完成）":""}`;
      }).join("\n");
  }
  /* ETF／成長 */
  if(/ETF|漲|跌|波動|成長/i.test(q)){
    if(!r.etf.length) return "目前沒有漲跌幅超過 5% 的 ETF 部位。";
    return "ETF 波動較大的客戶：\n" + r.etf.map(e=>`・${e.customer.name}：${e.product.name} ${e.product.changePct>0?"+":""}${e.product.changePct}%`).join("\n");
  }
  /* 資產排行／統計 */
  if(/資產|排行|AUM|規模/i.test(q)){
    const top = [...state.customers].sort((a,b)=>b.asset-a.asset).slice(0,5);
    const total = state.customers.reduce((s,c)=>s+c.asset,0);
    return `總資產 ${fmtMoney(total)}，資產前 ${top.length} 名：\n` + top.map((c,i)=>`${i+1}. ${c.name}　${fmtMoney(c.asset)}（${c.risk}）`).join("\n");
  }
  if(/幾位|多少客戶|統計|總共/.test(q)){
    const byRisk = {};
    state.customers.forEach(c => { byRisk[c.risk] = (byRisk[c.risk]||0)+1; });
    return `目前共 ${state.customers.length} 位客戶，風險屬性分布：${Object.entries(byRisk).map(([k,v])=>`${k} ${v} 位`).join("、")}。`
      + `\n待處理 Follow Up ${state.followUps.filter(f=>f.status==="pending").length} 筆，今日待辦 ${state.todos.length} 筆。`;
  }
  return "這個問題我還沒學會，可以試著問「今天該聯繫誰？」、「哪些商品要到期？」，或輸入客戶姓名查詢近況。輸入「功能」可以看完整能力清單。";
}

function askAssistant(text){
  const input = document.getElementById("assistantInput");
  if(input) input.value = text;
  sendAssistant();
}
function sendAssistant(){
  const input = document.getElementById("assistantInput");
  if(!input) return;
  const q = input.value.trim();
  if(!q || state.assistantTyping) return;
  input.value = "";
  state.assistantMessages.push({ role:"user", text:q });
  state.assistantTyping = true;
  refreshAssistantMsgs();
  setTimeout(() => {
    const reply = answerAssistant(q);
    state.assistantTyping = false;
    state.assistantMessages.push({ role:"ai", text:reply });
    if(state.assistantMessages.length > 60) state.assistantMessages = state.assistantMessages.slice(-40);
    saveData();
    refreshAssistantMsgs();
    /* 若動作改動了資料（例如建立待辦），同步更新主畫面 */
    if(/已把|已新增|已建立/.test(reply)) renderMainOnly();
  }, 550);
}
function toggleAssistant(){ state.assistantOpen = !state.assistantOpen; render(); }

/* ================================================================== */
/* 事件處理函式（全域）                                                    */
/* ================================================================== */

function setView(v){
  state.view = v; state.selectedId = null; state.bellOpen = false; state.menuOpen = null; state.dialog = null;
  detailTab = "basic";
  render();
}
function openCustomer(id){
  if(!findCustomer(id)) return;
  state.selectedId = Number(id); state.view = "customerDetail";
  state.bellOpen = false; state.menuOpen = null; state.dialog = null;
  detailTab = "basic";
  render();
}
function setTheme(mode){
  state.dark = mode === 'dark';
  document.documentElement.dataset.theme = mode;
  document.body.classList.toggle('dark', state.dark);
  try { localStorage.setItem('arm_theme', mode); } catch {}
  saveData(); render();
}
function toggleDark(){ setTheme(state.dark ? 'light' : 'dark'); }
function renderThemeControl(){
  return `<div class="theme-control" role="group" aria-label="色彩模式"><button type="button" aria-pressed="${!state.dark}" onclick="setTheme('light')">${icon('sun',14)}淺色</button><button type="button" aria-pressed="${state.dark}" onclick="setTheme('dark')">${icon('moon',14)}深色</button></div>`;
}

function toggleBell(){ state.bellOpen = !state.bellOpen; state.menuOpen = null; render(); }
function toggleMenu(id){ state.menuOpen = state.menuOpen === id ? null : id; state.bellOpen = false; render(); }
function toggleTodo(id){
  const t = state.todos.find(x=>x.id===id);
  if(t) t.done = !t.done;
  saveData(); render();
}
function completeFollowUp(id){
  const f = state.followUps.find(x=>x.id===id);
  if(!f) return;
  f.status = "done";
  f.doneDate = todayStr();
  state.menuOpen = null;
  state.dialog = null;
  saveData(); render();
  showToast("Follow Up 已標記完成");
}
function changeCalMonth(delta){
  let m = state.cal.month + delta, y = state.cal.year;
  if(m < 0){ m = 11; y -= 1; } if(m > 11){ m = 0; y += 1; }
  state.cal.month = m; state.cal.year = y; render();
}
function gotoCalToday(){
  state.cal.year = TODAY.getFullYear();
  state.cal.month = TODAY.getMonth();
  state.cal.selectedKey = toKey(TODAY);
  render();
}
function selectCalDay(key){ state.cal.selectedKey = key; render(); }

/* ================================================================== */
/* 主渲染函式                                                            */
/* ================================================================== */

function renderMainView(){
  if(state.view === "dashboard") return renderDashboard();
  if(state.view === "customers") return renderCustomers();
  if(state.view === "customerDetail") return renderCustomerDetail();
  if(state.view === "reminders") return renderReminders();
  if(state.view === "settings") return renderSettings();
  if(state.view === "calendar") return renderCalendar();
  if(state.view === "ai") return renderAIAssistantPage();
  return "";
}

/* 只重繪主內容區（避免打斷輸入焦點，例如助理面板正在使用中） */
function renderMainOnly(){
  const main = document.querySelector("main");
  if(main) main.innerHTML = renderMainView();
}

function render(){
  document.body.classList.toggle("dark", state.dark);
  document.documentElement.dataset.theme = state.dark ? "dark" : "light";

  // 未登入：只渲染登入頁與登入相關對話框，不掛載 Sidebar / TopBar / 任何受保護內容
  if(!state.authUser){
    const publicDialog = state.dialog && state.dialog.type === "forgot" ? renderDialog() : "";
    document.getElementById("app").innerHTML = renderLogin() + publicDialog;
    renderToast();
    return;
  }

  document.getElementById("app").innerHTML = `
    ${renderSidebar()}
    <div class="main-col">
      ${renderTopBar()}
      <main>${renderMainView()}</main>
    </div>
    ${renderDialog()}
    ${renderAssistant()}
  `;
  renderToast();
}

/* 點擊空白處關閉下拉選單 */
document.addEventListener("click", () => {
  if(state.bellOpen || state.menuOpen){
    state.bellOpen = false;
    state.menuOpen = null;
    render();
  }
});

/* Esc 關閉對話框／選單 */
document.addEventListener("keydown", (e) => {
  if(e.key !== "Escape") return;
  if(state.dialog){
    if(state.dialog.type === "call") endCall(false);
    else closeDialog();
  } else if(state.bellOpen || state.menuOpen){
    state.bellOpen = false; state.menuOpen = null; render();
  }
});

const toastDiv = document.createElement("div");
toastDiv.id = "toastWrap";
document.body.appendChild(toastDiv);

loadData();
try { const theme = localStorage.getItem("arm_theme"); if(theme === "dark" || theme === "light") state.dark = theme === "dark"; } catch {}
render();
</script>
</body>
